<!DOCTYPE html>
<html lang="en-us">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>ESP32-S3 Vibration Motor Control</title>
<style>
  :root {
    --bg: #f4f4f9;
    --card-bg: #ffffff;
    --text: #222;
    --sub: #666;
    --accent: #007bff;
    --ok: #2e7d32;
    --err: #c62828;
    --border: #ddd;
    --input-bg: #fff;
    --track: #d5d9e0;
    padding-top: env(safe-area-inset-top, 0px);
    padding-bottom: env(safe-area-inset-bottom, 0px);
    box-sizing: border-box;
  }
  @media (prefers-color-scheme: dark) {
    :root:not([data-theme="light"]) {
      --bg: #121212;
      --card-bg: #1e1e1e;
      --text: #eee;
      --sub: #aaa;
      --border: #444;
      --input-bg: #2a2a2a;
      --track: #444;
    }
  }
  :root[data-theme="dark"] {
    --bg: #121212;
    --card-bg: #1e1e1e;
    --text: #eee;
    --sub: #aaa;
    --border: #444;
    --input-bg: #2a2a2a;
    --track: #444;
  }
  * { box-sizing: border-box; }
  html, body { min-height: 100%; }
  body {
    margin: 0;
    font-family: -apple-system, "Segoe UI", Arial, sans-serif;
    text-align: center;
    background: var(--bg);
    color: var(--text);
    padding: 24px 16px;
    touch-action: manipulation; /* stops double-tap zoom while tapping buttons */
  }
  .card {
    background: var(--card-bg);
    max-width: 420px;
    margin: 0 auto;
    padding: 24px;
    border-radius: 16px;
    box-shadow: 0 4px 16px rgba(0,0,0,0.12);
  }
  h2 { margin-top: 0; font-size: 20px; }
  h3 { font-size: 16px; margin: 0 0 10px; text-align: left; }
  button {
    background: var(--accent);
    color: white;
    border: none;
    padding: 14px 26px;
    font-size: 16px;
    border-radius: 10px;
    cursor: pointer;
    margin-bottom: 18px;
    width: 100%;
  }
  button:disabled { background: #999; opacity: 0.6; }
  .status { color: var(--sub); margin-bottom: 16px; font-size: 14px; }
  .slider-group { margin: 18px 0; text-align: left; }
  label { font-weight: 600; font-size: 14px; color: var(--text); }
  .gpio { color: var(--sub); font-weight: 400; }
  .val { float: right; color: var(--accent); font-weight: 600; }
  .stop-btn { background: var(--err); margin-top: 8px; }
  .save-btn { background: var(--ok); margin: 0; width: auto; padding: 10px 16px; font-size: 15px; white-space: nowrap; }

  /* Sliders: bigger track + thumb so they are easy to drag with a finger */
  input[type=range] {
    -webkit-appearance: none;
    appearance: none;
    width: 100%;
    height: 36px;
    margin-top: 6px;
    background: transparent;
    cursor: pointer;
  }
  input[type=range]::-webkit-slider-runnable-track {
    height: 10px; border-radius: 5px; background: var(--track);
  }
  input[type=range]::-webkit-slider-thumb {
    -webkit-appearance: none;
    width: 32px; height: 32px; border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--card-bg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
    margin-top: -11px; /* centers the thumb on the 10px track */
  }
  input[type=range]::-moz-range-track {
    height: 10px; border-radius: 5px; background: var(--track);
  }
  input[type=range]::-moz-range-thumb {
    width: 28px; height: 28px; border-radius: 50%;
    background: var(--accent);
    border: 3px solid var(--card-bg);
    box-shadow: 0 2px 6px rgba(0,0,0,0.35);
  }

  /* Saved settings */
  .presets { margin-top: 24px; padding-top: 18px; border-top: 1px solid var(--border); }
  .save-row { display: flex; gap: 8px; margin-bottom: 14px; }
  .save-row input[type=text] {
    flex: 1; min-width: 0; padding: 10px 12px; font-size: 15px;
    border: 1px solid var(--border); border-radius: 10px;
    background: var(--input-bg); color: var(--text);
  }
  .preset-list { list-style: none; margin: 0; padding: 0; text-align: left; }
  .preset-item {
    display: flex; align-items: center; gap: 8px;
    border: 1px solid var(--border); border-radius: 10px;
    margin-bottom: 8px; overflow: hidden;
  }
  .preset-load {
    flex: 1; min-width: 0; text-align: left; background: transparent; color: var(--text);
    margin: 0; padding: 10px 12px; border-radius: 0; font-size: 15px;
  }
  .preset-load small { display: block; color: var(--sub); font-size: 12px; margin-top: 2px; }
  .preset-del {
    background: transparent; color: var(--err); width: auto;
    margin: 0; padding: 10px 14px; border-radius: 0; font-size: 18px;
  }
  .empty { color: var(--sub); font-size: 14px; text-align: left; }

  /* ---------- Tablet (iPad Pro 11" = 834pt wide, 12.9" = 1024pt wide in portrait) ---------- */
  @media (min-width: 700px) {
    body { padding: 32px 28px; font-size: 18px; }
    .card { max-width: 960px; padding: 36px 40px; border-radius: 22px; }
    h2 { font-size: 28px; margin-bottom: 20px; }
    h3 { font-size: 20px; margin-bottom: 14px; }
    button { font-size: 20px; padding: 18px 32px; min-height: 60px; border-radius: 14px; }
    .status { font-size: 17px; margin-bottom: 24px; }
    label { font-size: 18px; }
    .val { font-size: 22px; }
    .slider-group { margin: 0; padding: 14px 4px; }
    /* Fill top-to-bottom in each column: left = Motors 1-3, right = Motors 4-6 */
    #sliderArea {
      display: grid;
      grid-template-columns: 1fr 1fr;
      grid-template-rows: repeat(var(--rows, 3), auto);
      grid-auto-flow: column;
      column-gap: 40px;
      row-gap: 8px;
    }
    .save-btn { font-size: 18px; padding: 14px 22px; min-height: 52px; }
    .save-row input[type=text] { font-size: 18px; padding: 14px 16px; border-radius: 12px; }
    .preset-load { font-size: 18px; padding: 14px 16px; min-height: 60px; }
    .preset-load small { font-size: 14px; }
    .preset-del { font-size: 22px; padding: 14px 20px; }
    .empty { font-size: 16px; }
  }

  /* Saved Settings stays below the sliders on every screen size */
  @media (min-width: 700px) {
    .presets { margin-top: 32px; padding-top: 24px; }
  }
</style>
</head>
<body>

<div class="card">
  <h2>Vibration Motor BLE Controller</h2>
  <button id="connectBtn">📡 Connect to ESP32</button>
  <div class="status" id="status">Status: Not Connected</div>

  <div id="controls" style="opacity:0.4; pointer-events:none;">
    <div class="panel-left">
      <!-- Sliders are generated by the script below from the MOTORS list -->
      <div id="sliderArea"></div>
      <button class="stop-btn" id="stopBtn">■ Stop All</button>
    </div>

    <div class="presets">
      <h3>💾 Saved Settings</h3>
      <div class="save-row">
        <input type="text" id="presetName" placeholder="Name (e.g. P01)" maxlength="30">
        <button class="save-btn" id="saveBtn">Save Setting</button>
      </div>
      <ul class="preset-list" id="presetList"></ul>
    </div>
  </div>
</div>

<script>
  const SERVICE_UUID = "7f8af5cf-71f0-4e69-bd65-8cd908b98aa8";
  const CHARACTERISTIC_UUID = "4035d30f-3a2c-46c2-8f3a-5d94fa77e772";
  const MIN_SEND_INTERVAL = 60; // send minimum interval in ms, avoid sending too fast and blocking the BLE queue
  const STORAGE_KEY = "vibeSavedSettings";

  // To add/remove a motor, just edit this list. Order = byte order sent to the ESP32.
  const MOTORS = [
    { name: 'Motor 1', gpio: 4 },
    { name: 'Motor 2', gpio: 5 },
    { name: 'Motor 3', gpio: 6 },
    { name: 'Motor 4', gpio: 7 },
    { name: 'Motor 5', gpio: 15 },
    { name: 'Motor 6', gpio: 16 }
  ];

  let motorCharacteristic = null;
  let lastSent = 0;
  let pendingTimer = null;

  const statusEl = document.getElementById('status');
  const controlsEl = document.getElementById('controls');
  const connectBtn = document.getElementById('connectBtn');
  const sliderArea = document.getElementById('sliderArea');
  const presetNameEl = document.getElementById('presetName');
  const presetListEl = document.getElementById('presetList');

  // Half the motors per column on wide screens (6 motors -> 3 rows: left 1-3, right 4-6)
  sliderArea.style.setProperty('--rows', Math.ceil(MOTORS.length / 2));

  // Build sliders (each gets its own unique id: m0, m1, ... / v0, v1, ...)
  MOTORS.forEach((m, i) => {
    sliderArea.insertAdjacentHTML('beforeend', `
      <div class="slider-group">
        <label>${m.name} <span class="gpio">(GPIO ${m.gpio})</span> <span class="val" id="v${i}">0</span></label>
        <input type="range" id="m${i}" min="0" max="255" value="0">
      </div>
    `);
  });

  const sliders = MOTORS.map((_, i) => document.getElementById('m' + i));
  const valEls = MOTORS.map((_, i) => document.getElementById('v' + i));

  function setStatus(text, color) {
    statusEl.innerText = text;
    statusEl.style.color = color || '';
  }

  async function connectBLE() {
    if (!navigator.bluetooth) {
      setStatus('❌ This browser does not support Web Bluetooth (Please use Chrome/Edge; For iOS/iPadOS, please use Bluefy)', 'var(--err)');
      return;
    }
    try {
      setStatus('Searching...');
      const device = await navigator.bluetooth.requestDevice({
        filters: [{ name: 'ESP32_Vibe_Controller' }],
        optionalServices: [SERVICE_UUID]
      });

      setStatus('Connecting...');
      const server = await device.gatt.connect();
      const service = await server.getPrimaryService(SERVICE_UUID);
      motorCharacteristic = await service.getCharacteristic(CHARACTERISTIC_UUID);

      device.addEventListener('gattserverdisconnected', () => {
        setStatus('⚠️ Disconnected, please reconnect.', 'var(--err)');
        controlsEl.style.opacity = '0.4';
        controlsEl.style.pointerEvents = 'none';
        connectBtn.disabled = false;
        motorCharacteristic = null;
      });

      setStatus('✅ Successfully connected!', 'var(--ok)');
      controlsEl.style.opacity = '1';
      controlsEl.style.pointerEvents = 'auto';
      connectBtn.disabled = true;
    } catch (error) {
      console.error(error);
      setStatus('❌ Connection failed or cancelled.', 'var(--err)');
    }
  }

  function currentValues() {
    return sliders.map(s => parseInt(s.value, 10));
  }

  async function sendValues() {
    if (!motorCharacteristic) return;
    const values = currentValues(); // 6 bytes, one per motor
    try {
      await motorCharacteristic.writeValueWithoutResponse(new Uint8Array(values));
    } catch (e) {
      console.log('Failed to send values or frequency too high, skipping this update', e);
    }
  }

  function updateDisplay() {
    currentValues().forEach((v, i) => { valEls[i].innerText = v; });
  }

  function onSliderInput() {
    updateDisplay();
    const now = Date.now();
    if (now - lastSent >= MIN_SEND_INTERVAL) {
      lastSent = now;
      sendValues();
    } else {
      clearTimeout(pendingTimer);
      pendingTimer = setTimeout(() => { lastSent = Date.now(); sendValues(); }, MIN_SEND_INTERVAL);
    }
  }

  sliders.forEach(s => s.addEventListener('input', onSliderInput));
  // 放開滑桿時一定補送一次最終值，避免被節流吃掉
  sliders.forEach(s => s.addEventListener('change', sendValues));

  document.getElementById('stopBtn').addEventListener('click', () => {
    sliders.forEach(s => s.value = 0);
    updateDisplay();
    sendValues();
  });

  /* ---------- Saved settings (stored in this browser via localStorage) ---------- */

  function loadPresets() {
    try {
      const raw = localStorage.getItem(STORAGE_KEY);
      const list = raw ? JSON.parse(raw) : [];
      return Array.isArray(list) ? list : [];
    } catch (e) {
      console.log('Could not read saved settings', e);
      return [];
    }
  }

  function storePresets(list) {
    try {
      localStorage.setItem(STORAGE_KEY, JSON.stringify(list));
      return true;
    } catch (e) {
      console.log('Could not save settings', e);
      setStatus('⚠️ Could not save (browser storage unavailable).', 'var(--err)');
      return false;
    }
  }

  // Older saves may have fewer values (e.g. 4 motors); pad with 0 so nothing breaks
  function normalizedValues(p) {
    return MOTORS.map((_, i) => (p.values && Number.isFinite(p.values[i])) ? p.values[i] : 0);
  }

  function renderPresets() {
    const list = loadPresets();
    presetListEl.innerHTML = '';

    if (list.length === 0) {
      const li = document.createElement('li');
      li.className = 'empty';
      li.textContent = 'No saved settings yet.';
      presetListEl.appendChild(li);
      return;
    }

    list.forEach((p, idx) => {
      const li = document.createElement('li');
      li.className = 'preset-item';

      const loadBtn = document.createElement('button');
      loadBtn.className = 'preset-load';
      loadBtn.textContent = p.name;
      const small = document.createElement('small');
      small.textContent = normalizedValues(p).map((v, i) => 'M' + (i + 1) + ' ' + v).join(' · ');
      loadBtn.appendChild(small);
      loadBtn.addEventListener('click', () => applyPreset(p));

      const delBtn = document.createElement('button');
      delBtn.className = 'preset-del';
      delBtn.textContent = '✕';
      delBtn.title = 'Delete';
      delBtn.addEventListener('click', () => deletePreset(idx));

      li.appendChild(loadBtn);
      li.appendChild(delBtn);
      presetListEl.appendChild(li);
    });
  }

  function savePreset() {
    const list = loadPresets();
    let name = presetNameEl.value.trim();
    if (!name) name = 'Setting ' + (list.length + 1);

    const entry = { name: name, values: currentValues() };
    const existing = list.findIndex(p => p.name === name);
    if (existing >= 0) list[existing] = entry; // same name = overwrite
    else list.push(entry);

    if (storePresets(list)) {
      presetNameEl.value = '';
      renderPresets();
      setStatus('💾 Saved "' + name + '"', 'var(--ok)');
    }
  }

  function applyPreset(p) {
    normalizedValues(p).forEach((v, i) => { sliders[i].value = v; });
    updateDisplay();
    sendValues();
    setStatus('✅ Loaded "' + p.name + '"', 'var(--ok)');
  }

  function deletePreset(idx) {
    const list = loadPresets();
    const removed = list.splice(idx, 1)[0];
    if (storePresets(list)) {
      renderPresets();
      if (removed) setStatus('🗑️ Deleted "' + removed.name + '"');
    }
  }

  document.getElementById('saveBtn').addEventListener('click', savePreset);
  presetNameEl.addEventListener('keydown', e => { if (e.key === 'Enter') savePreset(); });

  renderPresets();
  connectBtn.addEventListener('click', connectBLE);
</script>

</body>
</html>
